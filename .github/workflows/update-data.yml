name: 自動更新國道里程數據

on:
  schedule:
    # 每天台灣時間凌晨 3:00 (UTC 19:00) 自動檢查更新
    - cron: '0 19 * * *'
  workflow_dispatch: # 支援手動觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 複製儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 執行更新與資料合併重構
        run: |
          python update_data.py

      - name: 偵測變更並提交
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "偵測到國道里程數據更新，準備提交變更..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/freeway_milestones.csv metadata.json
            git commit -m "chore(data): 自動同步政府最新國道百公尺里程數據"
            git push
            echo "最新國道里程數據已更新並提交至 GitHub！"
          else
            echo "線上資料無變更，無須更新。"
          fi
